name: 构建并发布 Docker 镜像

on:
  workflow_dispatch:
    inputs:
      is_beta:
        type: boolean
        required: true
        description: "开发版"
        default: true
      custom_version:
        type: string
        required: false
        description: "版本号"
        default: ""

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  DOCKER_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/xhs-downloader
  GHCR_REPO: ghcr.io/${{ secrets.DOCKERHUB_USERNAME }}/xhs-downloader

jobs:
  publish-docker:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: 获取最新的发布标签
        id: get-latest-release
        env:
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$CUSTOM_VERSION" ]; then
            LATEST_TAG=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
              | jq -er '.tag_name | select(type == "string" and length > 0)')
          else
            LATEST_TAG="$CUSTOM_VERSION"
          fi
          LATEST_TAG=$(python3 -I .github/scripts/release_tools.py validate "$LATEST_TAG")
          printf 'LATEST_TAG=%s\n' "$LATEST_TAG" >> "$GITHUB_ENV"

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 生成标签
        id: generate-tags
        env:
          IS_BETA: ${{ inputs.is_beta }}
        run: |
          if [ "$IS_BETA" = "true" ]; then
            LATEST_TAG=$(python3 -I .github/scripts/release_tools.py bump "$LATEST_TAG")
            python3 -I .github/scripts/release_tools.py validate "${LATEST_TAG}-dev" > /dev/null
            printf 'LATEST_TAG=%s\n' "$LATEST_TAG" >> "$GITHUB_ENV"
            TAGS="${DOCKER_REPO}:${LATEST_TAG}-dev,${GHCR_REPO}:${LATEST_TAG}-dev"
          else
            TAGS="${DOCKER_REPO}:${LATEST_TAG},${DOCKER_REPO}:latest,${GHCR_REPO}:${LATEST_TAG},${GHCR_REPO}:latest"
          fi
          printf 'TAGS=%s\n' "$TAGS" >> "$GITHUB_ENV"

      - name: 登录到 Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录到 GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建和推送 Docker 镜像到 Docker Hub 和 GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ env.TAGS }}
          provenance: false
          sbom: false
